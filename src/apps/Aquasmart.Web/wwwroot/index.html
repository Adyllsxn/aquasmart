<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquasmart</title>
    <!-- <base href="/" /> -->
    <base href="/aquasmart/" />
    
    <!-- Preload -->
    <link rel="preload" id="webassembly" />

    <!-- CSS Core -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link href="Aquasmart.Web.styles.css" rel="stylesheet" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />

    <!-- Blazorise -->
    <link href="_content/Blazorise.Icons.FontAwesome/v6/css/all.min.css" rel="stylesheet" />
    <link href="_content/Blazorise/blazorise.css?v=2.1.1.0" rel="stylesheet" />
    <link href="_content/Blazorise.Tailwind/blazorise.tailwind.css?v=2.1.1.0" rel="stylesheet" />

    <!-- PWA -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png" />
    
    <!-- Scripts -->
    <script type="importmap"></script>
    <script src="js/app.js"></script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <img src="assets/_loading.webp" alt="Aquasmart Loading..." class="logo" />
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Blazor Scripts -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
